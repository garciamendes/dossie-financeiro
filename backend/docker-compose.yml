# Infra de desenvolvimento do Dossiê Financeiro.
# Sobe apenas os serviços externos que o backend/.env aponta em localhost:
#   - PostgreSQL  -> DATABASE_URL=postgresql://postgres:postgres@localhost:5432/dossie
#   - Redis       -> REDIS_URL=redis://localhost:6379
#
# Uso:
#   docker compose up -d
#   cd backend && npx prisma migrate dev && npm run start:dev
#
# O NestJS continua rodando no host (não containerizado) para hot-reload rápido.

services:
  postgres:
    image: postgres:16-alpine
    container_name: dossie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dossie
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dossie"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dossie-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
